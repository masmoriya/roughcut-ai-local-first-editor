[package]
name = "roughcut-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RoughCut — local transcript-based video editor with DaVinci Resolve XML export."

[lib]
name = "roughcut_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
roughcut-core = { path = "../../core", features = ["whisper-native"] }
tauri = { version = "2", features = [] }
percent-encoding = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3"
